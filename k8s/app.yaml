apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spendly-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendly
  labels:
    app: spendly
spec:
  # SQLite allows one writer, so one replica. Scaling out means moving to a client-server database first.
  replicas: 1
  # The ReadWriteOnce volume cannot be shared, so the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spendly
  template:
    metadata:
      labels:
        app: spendly
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spendly
          image: ghcr.io/mahmoud35amri/spendly-devops
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: spendly-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=spendly,k8s.pod.name=$(POD_NAME)
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spendly-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spendly
spec:
  type: NodePort
  selector:
    app: spendly
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
