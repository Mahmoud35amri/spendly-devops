name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Backend size guard (max 150 lines of code)
        run: |
          # Lines of code = no blank lines, no comments. The API is app.js + db.js; observability.js and
          # tracing.js are instrumentation, reported separately.
          loc() { cat "$@" | grep -vcE '^\s*($|//)'; }
          api=$(loc server/app.js server/db.js); obs=$(loc server/observability.js server/tracing.js)
          echo "API: $api lines of code (limit 150), observability instrumentation: $obs"
          echo "### Backend size: $api / 150 lines of code (+ $obs lines of observability instrumentation)" >> "$GITHUB_STEP_SUMMARY"
          test "$api" -le 150

      - name: Test (API integration tests + widget self-check)
        run: node --test --test-reporter=spec

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # On pull requests CodeQL only reports results on changed lines by default, so a PR could pass while
      # main fails on older code. Analyze the whole repository every time: the gate means the same everywhere.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: sarif

      - name: Fail on any finding
        run: |
          # CodeQL leaves "level" unset for most rules, so the gate counts every result: fix it or exclude the rule on purpose.
          total=$(jq '[.runs[].results[]] | length' sarif/*.sarif)
          echo "### CodeQL: $total finding(s)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[] | "- \(.ruleId) at \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine): \(.message.text)"' sarif/*.sarif >> "$GITHUB_STEP_SUMMARY"
          test "$total" -eq 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeql-sarif
          path: sarif/

  image:
    name: Docker image
    needs: [test, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" .

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 3000:3000 "$IMAGE:latest"
          for i in $(seq 1 20); do curl -fsS localhost:3000/api/health && exit 0; sleep 1; done
          docker logs smoke; exit 1

      - name: Save the image for the deploy job
        run: docker save "$IMAGE:sha-${GITHUB_SHA::7}" -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

      - name: Push to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGE"
          echo "### Published \`$IMAGE:sha-${GITHUB_SHA::7}\` and \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Kubernetes (kind)
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          config: k8s/kind-config.yaml
          cluster_name: spendly

      - name: Deploy this commit's image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          docker load -i image.tar
          kind load docker-image "$image" --name spendly
          sed -i "s/newTag: .*/newTag: sha-${GITHUB_SHA::7}/" k8s/kustomization.yaml
          kubectl apply -k k8s
          kubectl -n spendly rollout status deploy/spendly --timeout=180s
          kubectl -n spendly rollout status deploy/jaeger --timeout=180s

      - name: Smoke test through the NodePort
        run: |
          curl -fsS localhost:30080/api/health
          key=$(openssl rand -hex 20)
          curl -fsS -X POST localhost:30080/api/sync -H "Authorization: Bearer $key" \
            -d '{"since":0,"changes":[{"kind":"expense","id":"ci","updatedAt":1,"data":{"amount":1}}]}' | grep -q '"id":"ci"'
          curl -fsS localhost:30080/metrics | grep -q 'route="/api/sync",status="200"'
          # Spans are exported in batches every few seconds: wait until the service shows up in Jaeger.
          for i in $(seq 1 15); do curl -fsS localhost:30686/api/v3/services | grep -q spendly && break; sleep 2; done
          curl -fsS localhost:30686/api/v3/services | grep -q spendly
          echo "### Deployed \`sha-${GITHUB_SHA::7}\` to kind: health, sync, metrics and tracing OK" >> "$GITHUB_STEP_SUMMARY"

      - name: DAST - OWASP ZAP API scan of the deployed service
        run: |
          # Lift the rate limit for the scan, so ZAP's attack requests reach the handlers instead of stopping at 429.
          kubectl -n spendly set env deploy/spendly RATE_LIMIT_PER_MIN=100000
          kubectl -n spendly rollout status deploy/spendly --timeout=120s
          mkdir -p zap && cp openapi.yaml zap/ && chmod -R 777 zap
          # -I: warnings do not fail the scan; the next step fails the build on High risk alerts instead.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $(openssl rand -hex 20)" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t openapi.yaml -f openapi -O http://localhost:30080 \
            -r zap-report.html -J zap-report.json -w zap-report.md -I

      - name: Fail on High risk DAST alerts
        run: |
          echo "### OWASP ZAP alerts" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.site[].alerts[] | "- \(.riskdesc): \(.name) (\(.count) instance(s))"' zap/zap-report.json >> "$GITHUB_STEP_SUMMARY"
          high=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 3)] | length' zap/zap-report.json)
          test "$high" -eq 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*

      - name: Cluster state
        if: always()
        run: |
          kubectl -n spendly get all,pvc,configmap -o wide
          kubectl -n spendly logs deploy/spendly --tail=30
