# One-time admin setup of the production cluster (docs/CLOUD.md), after k3s and cert-manager:
#   sudo k3s kubectl apply -f k8s/namespace.yaml -f k8s/production/cluster/
# CI never applies these: its deploy account cannot touch cluster-wide objects or the namespace.

# Let's Encrypt via the HTTP-01 challenge, answered through Traefik.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# Redirect plain HTTP to HTTPS (used by the app's Ingress only, so ACME challenges stay on HTTP).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: spendly
spec:
  redirectScheme:
    scheme: https
    permanent: true
