# docker compose up --build
#   app         http://localhost:3000    (PWA + API, /metrics)
#   grafana     http://localhost:3001    (dashboard "Spendly API", anonymous read access)
#   prometheus  http://localhost:9090
#   jaeger      http://localhost:16686   (traces of service "spendly")
services:
  app:
    build: .
    image: ghcr.io/mahmoud35amri/spendly-devops:latest
    ports:
      - "3000:3000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - spendly-data:/data
    depends_on:
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/spendly.json
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  spendly-data:
